<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Notebook Dots — the classic paper game</title>
  <meta name="description" content="The classic notebook dots game: surround your opponent's dots on squared paper.">
  <!-- CrazyGames SDK v3 (poza CrazyGames działa w trybie "disabled", gra działa normalnie) -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <link rel="preload" href="fonts/caveat-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23fdfbf3'/><circle cx='10' cy='16' r='5' fill='%231e4fd6'/><circle cx='22' cy='16' r='5' fill='%23d8342c'/></svg>">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <span class="logo-dot blue"></span><span class="logo" data-i18n="title">Notebook Dots</span><span class="logo-dot red"></span>
      </div>

      <div class="players">
        <div class="player p1" id="card1">
          <div class="player-head">
            <span class="ink blue"></span>
            <input class="name" id="name1" maxlength="14" autocomplete="off" spellcheck="false">
          </div>
          <div class="score" id="score1">0</div>
          <div class="turn-flag" data-i18n="yourTurnFlag"></div>
        </div>
        <div class="player p2" id="card2">
          <div class="player-head">
            <span class="ink red"></span>
            <input class="name" id="name2" maxlength="14" autocomplete="off" spellcheck="false">
          </div>
          <div class="score" id="score2">0</div>
          <div class="turn-flag" data-i18n="yourTurnFlag"></div>
        </div>
      </div>

      <p class="status" id="status"></p>

      <div class="buttons">
        <button id="newGame" class="btn primary" data-i18n="newGame"></button>
        <button id="undo" class="btn"><span aria-hidden="true">↶</span> <span data-i18n="undo"></span></button>
        <button id="menuBtn" class="btn"><span aria-hidden="true">☰</span> <span data-i18n="menu"></span></button>
      </div>
    </aside>

    <main class="board-wrap">
      <div class="page" id="page">
        <canvas id="board"></canvas>
        <div class="hint" id="hint" data-i18n="hint"></div>
        <div class="toast" id="toast"></div>
      </div>
    </main>
  </div>

  <dialog id="menu" class="sheet">
    <h2 data-i18n="menu"></h2>
    <div class="form">
      <label><span data-i18n="mode"></span>
        <select id="mode">
          <option value="pvp" data-i18n="modePvp"></option>
          <option value="ai1" data-i18n="modeAi1"></option>
          <option value="ai2" data-i18n="modeAi2"></option>
        </select>
      </label>
      <label><span data-i18n="size"></span>
        <select id="size">
          <option value="16x12" data-i18n-size="sizeS"></option>
          <option value="24x18" data-i18n-size="sizeM"></option>
          <option value="32x24" data-i18n-size="sizeL"></option>
        </select>
      </label>
      <label><span data-i18n="language"></span>
        <select id="lang"></select>
      </label>
      <label><span data-i18n="sound"></span>
        <button id="soundBtn" class="btn toggle" type="button"></button>
      </label>
    </div>
    <div class="row">
      <button id="rulesBtn" class="btn ghost" type="button" data-i18n="rules"></button>
      <button id="endGame" class="btn ghost" type="button" data-i18n="endGame"></button>
      <button id="menuClose" class="btn primary" type="button" data-i18n="done"></button>
    </div>
  </dialog>

  <dialog id="rules" class="sheet">
    <h2 data-i18n="rulesTitle"></h2>
    <ol id="rulesList"></ol>
    <div class="row"><button id="rulesClose" class="btn primary" type="button" data-i18n="rulesOk"></button></div>
  </dialog>

  <dialog id="over" class="sheet">
    <h2 id="overTitle"></h2>
    <p id="overText"></p>
    <div class="row">
      <button id="overView" class="btn" type="button" data-i18n="viewBoard"></button>
      <button id="overAgain" class="btn primary" type="button" data-i18n="again"></button>
    </div>
  </dialog>

  <script src="js/i18n.js"></script>
  <script src="js/platform.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
